# Project identification
sonar.projectKey=bookmark-management
sonar.projectName=Bookmark Management

# Path to sources and tests
sonar.sources=.
sonar.tests=.

# Exclude auto-generated code, mocks, docs, and non-source dirs from MAIN analysis.
# Do NOT put *_test.go here — let it flow into the TEST scope below instead,
# otherwise it conflicts with sonar.test.inclusions.
sonar.exclusions=**/mocks/**, **/mock*.go, **/docs/**, **/swagger/**, .gemini/**

# Include test files, test fixtures, and test helpers in the test analysis scope.
# This allows SonarQube to scan them for bugs and code smells, but excludes them from coverage requirements.
sonar.test.inclusions=**/*_test.go, **/internal/test/**

# Exclude auto-generated mocks from test scope
sonar.test.exclusions=**/mocks/**, **/mock*.go

# Disable Copy-Paste Detector (CPD) for test files, test fixtures, test helpers, and mocks.
# This is the primary mechanism for stopping duplication checks on test/mocks — don't rely on sonar.exclusions for that.
sonar.cpd.exclusions=**/*_test.go, **/internal/test/**, **/mocks/**, **/mock*.go

# CODE COVERAGE REPORT:
# Point SonarQube to the Go coverage report file generated during CI
sonar.go.coverage.reportPaths=coverage.out