# Project identification
sonar.projectKey=bookmark-management
sonar.projectName=Bookmark Management

# Path to sources and tests
sonar.sources=.
sonar.tests=.

# Exclude auto-generated code and mocks completely from all analyses
sonar.exclusions=**/mocks/**, **/docs/**, **/swagger/**, .gemini/**

# Include test files in the test analysis scope.
# This allows SonarQube to scan them for bugs and code smells, but excludes them from coverage requirements.
sonar.test.inclusions=**/*_test.go

# Exclude auto-generated mocks from test scope
sonar.test.exclusions=**/mocks/**

# SPECIFIC RULE EXCLUSION:
# Disable Copy-Paste Detector (CPD) ONLY for test files.
# Test files will still be analyzed for bugs, vulnerabilities, and code smells.
sonar.cpd.exclusions=**/*_test.go

# CODE COVERAGE REPORT:
# Point SonarQube to the Go coverage report file generated during CI
sonar.go.coverage.reportPaths=coverage.out